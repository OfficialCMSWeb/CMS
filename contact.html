<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Contact Directory</title>

    <!-- Font Awesome CDN --> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">   

    <!-- Link to external CSS --> 
    <link rel="stylesheet" href="reg.css">

    <style>
        /* Logo Styles */
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #000000;
            transition: opacity 0.2s ease;
        }

        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
        }

        .logo:hover {
            opacity: 0.85;
        }

        /* Main Section Layout */
        .contacts-section {
            padding: 50px 0 80px 0;
        }

        .contacts-card {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid rgb(43, 154, 245);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            color: #000000;
        }

        .contacts-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .contacts-header h2 {
            font-size: 1.8rem;
            color: #000000;
            margin-bottom: 10px;
        }

        .contacts-header h2 i {
            color: rgb(43, 154, 245);
            margin-right: 10px;
        }

        /* Department Selector Buttons */
        .dept-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .dept-btn {
            padding: 12px 24px;
            background: #ffffff;
            border: 2px solid rgb(43, 154, 245);
            border-radius: 30px;
            color: rgb(43, 154, 245);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dept-btn:hover {
            background: rgba(43, 154, 245, 0.1);
            transform: translateY(-2px);
        }

        .dept-btn.active {
            background: rgb(43, 154, 245);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(43, 154, 245, 0.3);
        }

        /* Contact Cards Display Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .contact-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .contact-card:hover {
            border-color: rgb(43, 154, 245);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .card-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #eef7ff;
            color: rgb(43, 154, 245);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 15px auto;
        }

        .card-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.9rem;
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333333;
            word-break: break-word;
        }

        .detail-item i {
            color: rgb(43, 154, 245);
            width: 16px;
        }

        .detail-item a {
            color: #333333;
            text-decoration: none;
        }

        .detail-item a:hover {
            color: rgb(43, 154, 245);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .dept-buttons {
                flex-direction: column;
            }
            .dept-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="container header-container">
        <a href="Index.html" class="logo">
            <img src="cms-logo.png" alt="CMS Logo" class="logo-img">
            <span class="logo-text">CMS</span>
        </a>

        <nav>
            <ul>
                <li><a href="Index.html">Home</a></li>
                <li><a href="contacts.html" class="active">Contacts</a></li>
                <li><a href="calendar.html">Calendar</a></li>
            </ul>
        </nav>

        <div class="nav-buttons">
            <a href="#" class="btn btn-secondary">Donate</a>
            <a href="reg.html" class="btn btn-primary">Register Request</a>
        </div>
    </div>
</header>

<!-- Weather Bar -->
<div class="weather-bar">
    <div class="container weather-container">
        <span class="weather-location"><i class="fa-solid fa-location-dot"></i> Nashville, TN</span>
        <span class="weather-info" id="weather-info"><i class="fa-solid fa-spinner fa-spin"></i> Loading weather...</span>
    </div>
</div>

<!-- Contacts Section -->
<section class="contacts-section">
    <div class="container">
        <div class="contacts-card">
            <div class="contacts-header">
                <h2><i class="fa-solid fa-address-book"></i> School Contact Directory</h2>
                <p>Select a department below to display staff contact details.</p>
            </div>

            <!-- Department Navigation Buttons -->
            <div class="dept-buttons">
                <button class="dept-btn active" onclick="showDepartment('it', this)">
                    <i class="fa-solid fa-laptop-code"></i> Information Technology
                </button>
                <button class="dept-btn" onclick="showDepartment('teachers', this)">
                    <i class="fa-solid fa-chalkboard-user"></i> Teachers
                </button>
                <button class="dept-btn" onclick="showDepartment('principal', this)">
                    <i class="fa-solid fa-user-tie"></i> Principal
                </button>
            </div>

            <!-- Contact Cards Container -->
            <div class="cards-grid" id="cards-container"></div>
        </div>
    </div>
</section>

<script>
    // Department Contact Data (Edit these details as needed)
    const contactsData = {
        it: [
            {
                name: "Nasir Abdullah",
                role: "IT Department",
                email: "cmsstudentsit@gmail.com",
                phone: "(615) 755-9128"
            },
            {
                name: "Eric Burch",
                role: "IT Department",
                email: "cmsstudentsit@gmail.com",
                phone: "N/A"
            }
        ],
        teachers: [
            {
                name: "Malika Burch",
                role: "Teacher",
                email: "claramohammedschools@gmail.com",
                phone: "N/A"
            },
            {
                name: "Shareefah Hazelwood",
                role: "Teacher",
                email: "claramohammedschools@gmail.com",
                phone: "N/A"
            }
        ],
        principal: [
            {
                name: "Aaliyah Abdullah",
                role: "School Principal",
                email: "claramohammedschools@gmail.com",
                phone: "N/A"
            },
            {
                name: "Mahasin Abdullah",
                role: "Assistant Principal",
                email: "claramohammedschools@gmail.com",
                phone: "N/A"
            }
        ]
    };

    // Render Contact Cards for Selected Department
    function showDepartment(deptKey, clickedBtn) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        // Update active class on buttons
        document.querySelectorAll('.dept-btn').forEach(btn => btn.classList.remove('active'));
        if (clickedBtn) clickedBtn.classList.add('active');

        const staffList = contactsData[deptKey] || [];

        staffList.forEach(person => {
            const card = document.createElement('div');
            card.className = 'contact-card';

            card.innerHTML = `
                <div class="card-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="card-name">${person.name}</div>
                <div class="card-title">${person.role}</div>
                <div class="card-details">
                    <div class="detail-item">
                        <i class="fa-regular fa-envelope"></i>
                        <a href="mailto:${person.email}">${person.email}</a>
                    </div>
                    <div class="detail-item">
                        <i class="fa-solid fa-phone"></i>
                        <a href="tel:${person.phone}">${person.phone}</a>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Weather API Script
    async function fetchWeather() {
        try {
            const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.1659&longitude=-86.7844&current_weather=true&temperature_unit=fahrenheit');
            const data = await response.json();
            
            const temp = Math.round(data.current_weather.temperature);
            const code = data.current_weather.weathercode;
            
            let condition = "Clear";
            let icon = "fa-sun";
            
            if (code > 0 && code <= 3) { condition = "Partly Cloudy"; icon = "fa-cloud-sun"; }
            else if (code >= 45 && code <= 48) { condition = "Foggy"; icon = "fa-smog"; }
            else if (code >= 51) { condition = "Rainy"; icon = "fa-cloud-rain"; }

            document.getElementById('weather-info').innerHTML = `<i class="fa-solid ${icon}"></i> ${temp}°F ${condition}`;
        } catch (err) {
            document.getElementById('weather-info').innerHTML = `<i class="fa-solid fa-cloud"></i> Weather Unavailable`;
        }
    }

    // Load IT department by default on open
    showDepartment('it', document.querySelector('.dept-btn.active'));
    fetchWeather();
</script>

</body>
</html>
